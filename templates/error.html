{% extends "base.html" %}
{% block title %}{{ code }} — Error{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 5rem 1rem;">
  <h1 class="page-title" style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--rust);">{{ code }}</h1>
  <p style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.5rem;">{{ message }}</p>
  <div style="display: flex; gap: 0.75rem; justify-content: center;">
    <a href="/" class="btn btn-primary btn-sm">&larr; Back to ECHO</a>
    <a href="/search" class="btn btn-secondary btn-sm">Search Echoes</a>
  </div>
</div>
{% endblock %}
