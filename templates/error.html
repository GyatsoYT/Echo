{% extends "base.html" %}
{% block title %}{{ code }} — Error{% endblock %}
{% block content %}
<div class="container" style="text-align: center; padding: 6rem 0;">
  <div style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.4;">◈</div>
  <h1 style="font-size: 5rem; background: linear-gradient(135deg, var(--purple-400), var(--violet-500)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem;">{{ code }}</h1>
  <p style="color: var(--text-secondary); font-size: 1.125rem; margin-bottom: 2rem;">{{ message }}</p>
  <div style="display: flex; gap: 0.875rem; justify-content: center; flex-wrap: wrap;">
    <a href="/" class="btn btn-primary">← Home</a>
    <a href="/search" class="btn btn-ghost">Ask a Question</a>
  </div>
</div>
{% endblock %}
